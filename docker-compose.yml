services:
  postgres:
    image: postgres:16-alpine
    container_name: stockfor-postgres
    expose:
      - "5432"
    env_file:
      - /home/ubuntu/.env
    volumes:
      - /home/ubuntu/postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  springboot:
    build: ./core
    container_name: stockfor-app
    expose:
      - "8080"
    volumes:
      - /home/ubuntu/kiwoom_api.yml:/config/kiwoom_api.yml:ro
    env_file:
      - /home/ubuntu/.env
    depends_on:
      - postgres
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: stockfor-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - springboot
    restart: unless-stopped
