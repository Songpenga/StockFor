# 로컬 개발 전용 프로필 (spring.profiles.active=local 일 때만 적용)
# 운영 배포(docker-compose)는 이 프로필을 켜지 않으므로 이 파일은 무시됨

# 로컬 PC에 Postgres가 없으므로 DataSource/JPA 자동설정을 끔
# User/LoginLog(로그인 기능)은 아직 미구현이라 로컬에서는 DB 없이 조회 API만 테스트
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# 운영은 /config/kiwoom_api.yml(컨테이너 마운트 경로)을 읽지만, 로컬은 resources에 있는 파일을 그대로 사용
spring.config.import=optional:classpath:kiwoom_api.yml
