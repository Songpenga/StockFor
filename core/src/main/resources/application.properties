spring.application.name=core

server.port = 8080

spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:stockfor}
spring.datasource.username=${POSTGRES_USER:stockfor}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.config.import=optional:file:/config/kiwoom_api.yml

logging.level.root=WARN
logging.level.hello.coreStock=INFO
logging.level.com.zaxxer.hikari.pool.HikariPool=WARN

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger/OpenAPI - 조회 API만 노출, 주문/토큰/관리자 엔드포인트는 문서에서 제외
springdoc.paths-to-exclude=/api/trade/**,/api/kiwoom/**,/api/admin/**,/api/account/**